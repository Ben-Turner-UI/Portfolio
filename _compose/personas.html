<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P4 personas thumbnail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1760px;
      height: 1022px;
      overflow: hidden;
      background: #eef0f5;
    }
    .stage {
      width: 1760px;
      height: 1022px;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .card {
      position: absolute;
      z-index: 3;
      width: 312px;
      background: #fff;
      border: 5px solid #C3C7CE;
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(17, 24, 39, 0.08);
      padding: 20px 20px 18px;
    }
    .card.left { left: 88px; top: 332px; }
    .card.tr { right: 88px; top: 72px; }
    .card.br { right: 88px; bottom: 72px; }
    .p4 {
      width: 24px;
      height: 34px;
      display: block;
      margin-bottom: 12px;
    }
    .avatar {
      width: 164px;
      height: 164px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 18px;
    }
    .meta {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 2px;
    }
    .bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bar {
      height: 14px;
      border-radius: 7px;
      background: #e4e2dc;
    }
    .bar.short { width: 58%; }
    .trend {
      width: 48px;
      height: 38px;
      flex: none;
    }
  </style>
</head>

  <div class="stage">
    <img class="bg" src="personas-bg.jpg" alt="">

        <svg class="trend" viewBox="0 0 56 44" fill="none" aria-hidden="true">
