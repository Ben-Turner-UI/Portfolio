<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Budibase thumbnail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 2560px; height: 1440px; overflow: hidden; background: #4F46C8; }
    .stage {
      width: 2560px;
      height: 1440px;
      position: relative;
      background:
        radial-gradient(1100px 820px at 8% 12%, rgba(242, 92, 84, 0.42), transparent 58%),
        radial-gradient(980px 760px at 92% 18%, rgba(167, 139, 250, 0.38), transparent 55%),
        radial-gradient(1100px 860px at 86% 96%, rgba(110, 168, 254, 0.28), transparent 58%),
        radial-gradient(900px 700px at 12% 92%, rgba(139, 124, 246, 0.40), transparent 60%),
        #5347D0;
      overflow: hidden;
    }
    .iso {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(30deg, rgba(255,255,255,0.06) 1.5px, transparent 1.5px),
        linear-gradient(150deg, rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
      background-size: 120px 208px, 120px 208px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 78%);
      pointer-events: none;
    }
    .poly {
      position: absolute;
      z-index: 2;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      display: flex;
      align-items: center;
      gap: 52px;
      z-index: 5;
    }
    .lockup .mark { width: 268px; height: 268px; display: block; }
    .lockup .word { width: 720px; height: 170px; display: block; }
    .card {
      position: absolute;
      background: #fff;
      border-radius: 44px;
      box-shadow: 0 24px 50px rgba(28, 18, 72, 0.22);
      z-index: 4;
      overflow: hidden;
    }
    .card.left { left: 120px; top: 360px; width: 560px; height: 720px; padding: 48px 44px 44px; }
    .card.tr { right: 120px; top: 96px; width: 560px; height: 560px; padding: 48px 44px 44px; }
    .card.br { right: 120px; bottom: 96px; width: 560px; height: 560px; padding: 48px 44px 44px; }
    .comp {
      width: 56px;
      height: 56px;
      margin-bottom: 36px;
      display: block;
    }
    .flow {
      position: relative;
      height: 520px;
    }
    .node {
      position: absolute;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(83, 71, 208, 0.16);
    }
    .node.a { left: 40px; top: 36px; background: #F25C54; }
    .node.b { right: 48px; top: 176px; background: #8B7CF6; }
    .node.c { left: 88px; bottom: 28px; background: #6EA8FE; }
    .flow svg.wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .toggles { display: flex; flex-direction: column; gap: 48px; margin-top: 12px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }
    .pill {
      height: 36px;
      border-radius: 18px;
      background: #E6E4F4;
      flex: 1;
    }
    .pill.short { max-width: 58%; }
    .sw {
      width: 148px;
      height: 80px;
      border-radius: 40px;
      background: #E6E4F4;
      position: relative;
      flex: none;
    }
    .sw.on { background: #8B7CF6; }
    .sw i {
      position: absolute;
      top: 8px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 6px 16px rgba(28, 18, 72, 0.16);
    }
    .sw.on i { right: 8px; }
    .sw:not(.on) i { left: 8px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-top: 8px;
    }
    .cell {
      height: 96px;
      border-radius: 22px;
      background: #EEEAF8;
    }
    .cell.c1 { background: #F25C54; }
    .cell.c2 { background: #8B7CF6; }
    .cell.c3 { background: #6EA8FE; }
    .cell.c4 { background: #C4B5FD; }
    .cell.mid { background: #F8A5A0; }
  </style>
</head>
