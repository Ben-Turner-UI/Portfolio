<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title id="t">cityfibre-postcode-checks metric card</title><desc id="d">90% more postcode checks than the month before launch, counted with a Google Analytics flag.</desc><rect width="1200" height="675" fill="#fcfcfb"/><text x="72" y="104" font-size="26" font-weight="600" fill="#104281" text-anchor="start">DawsonAndrews, 2024. CityFibre</text><text x="72" y="317.20000000000005" font-size="240" font-weight="700" fill="#104281" text-anchor="start" letter-spacing="-7.199999999999999">+90%</text><text x="72" y="395.20000000000005" font-size="40" font-weight="500" fill="#0b0b0b" text-anchor="start"><tspan x="72" dy="0">More postcode checks than the month before</tspan><tspan x="72" dy="52">launch</tspan></text><line x1="72" y1="590" x2="1128" y2="590" stroke="#d9d8d1" stroke-width="2"/><text x="72" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">Google Analytics flag. The launch also shipped the new brand.</text><text x="1128" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="end">benturner.work</text></svg>
