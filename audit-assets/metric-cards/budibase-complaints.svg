<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title id="t">budibase-complaints metric card</title><desc id="d">Complaints a month on the Budibase community Discord: from 8 to 10 to zero within a month, and still zero three months later.</desc><rect width="1200" height="675" fill="#fcfcfb"/><text x="72" y="104" font-size="26" font-weight="600" fill="#104281" text-anchor="start">Budibase, 2025. Automations</text><text x="72" y="262.6" font-size="170" font-weight="700" fill="#104281" text-anchor="start" letter-spacing="-5.1">8-10 to 0</text><text x="72" y="340.6" font-size="40" font-weight="500" fill="#0b0b0b" text-anchor="start"><tspan x="72" dy="0">Complaints a month on the community Discord</tspan></text><line x1="72" y1="590" x2="1128" y2="590" stroke="#d9d8d1" stroke-width="2"/><text x="72" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">Zero within a month, still zero after three. No post-launch test.</text><text x="1128" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="end">benturner.work</text></svg>
