<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title id="t">cityfibre-portal-satisfaction metric card</title><desc id="d">B2B portal satisfaction rose from 4 out of 10 to 8 out of 10 when the same 40 users re-tested.</desc><rect width="1200" height="675" fill="#fcfcfb"/><text x="72" y="104" font-size="26" font-weight="600" fill="#104281" text-anchor="start">DawsonAndrews, 2024. CityFibre</text><text x="72" y="229.84" font-size="128" font-weight="700" fill="#104281" text-anchor="start" letter-spacing="-3.84">4/10 to 8/10</text><text x="72" y="307.84000000000003" font-size="40" font-weight="500" fill="#0b0b0b" text-anchor="start"><tspan x="72" dy="0">B2B portal satisfaction, re-tested with the</tspan><tspan x="72" dy="52">same 40 users</tspan></text><line x1="72" y1="590" x2="1128" y2="590" stroke="#d9d8d1" stroke-width="2"/><text x="72" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">As stated on the case study</text><text x="1128" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="end">benturner.work</text></svg>
