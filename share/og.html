<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ben Turner.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #faf9f5;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        linear-gradient(rgba(20, 20, 19, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 20, 19, 0.055) 1px, transparent 1px);
      background-size: 48px 48px;
      background-position: center;
    }

    .mark {
      margin: 0;
      font-family: "Big Shoulders", sans-serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-size: 112px;
      line-height: 0.9;
      letter-spacing: 0.1px;
      color: #141413;
    }

    .mark span {
      color: #ff4d00;
    }

</head>
<body>
  <p class="mark">Ben Turner<span>.</span></p>
